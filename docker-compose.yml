version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: signlearn-backend
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=SignLearn API
      - APP_VERSION=1.0.0
      - DEBUG=False
    volumes:
      - ./backend:/app
    networks:
      - signlearn-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: signlearn-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - signlearn-network
    restart: unless-stopped

networks:
  signlearn-network:
    driver: bridge